<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Vaasut Engine</title>
    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #1a1a2e;
        }
        canvas {
            width: 100%;
            height: 100%;
            display: block;
        }
        /* Экран загрузки */
        #loading {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: #1a1a2e;
            color: #e0e0e0;
            font-family: monospace;
            z-index: 10;
        }
        #loading h1 {
            font-size: 2rem;
            color: #f97316;
            margin-bottom: 0.5rem;
        }
        #loading p {
            font-size: 0.9rem;
            color: #888;
        }
        .spinner {
            width: 40px; height: 40px;
            border: 3px solid #333;
            border-top-color: #f97316;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin-bottom: 1rem;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
    </style>
</head>
<body>
    <div id="loading">
        <div class="spinner"></div>
        <h1>Vaasut</h1>
        <p>Loading engine...</p>
    </div>
    <canvas id="vaasut_canvas"></canvas>
    <script type="module">
        import init from './vaasut.js';
        init().then(() => {
            document.getElementById('loading').style.display = 'none';
        });
    </script>
</body>
</html>
