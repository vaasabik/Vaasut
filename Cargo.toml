[package]
name = "vaasut"
version = "0.1.0"
edition = "2021"
description = "Vaasut — a cross-platform game engine and editor built with Rust"
license = "MIT OR Apache-2.0"
repository = "https://github.com/vaasabik/vaasut"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
eframe = { version = "0.28", default-features = false, features = ["wgpu", "default_fonts"] }
egui = "0.28"
log = "0.4"

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen-futures = "0.4"
