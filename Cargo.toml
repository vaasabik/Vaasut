[package]
name = "vaasut"
version = "0.1.0"
edition = "2021"

[workspace]
resolver = "2"
members = [
    "crates/vaasut-animation",
    "crates/vaasut-asset",
    "crates/vaasut-audio",
    "crates/vaasut-core",
    "crates/vaasut-ecs",
    "crates/vaasut-editor",
    "crates/vaasut-input",
    "crates/vaasut-math",
    "crates/vaasut-physics",
    "crates/vaasut-renderer",
    "crates/vaasut-runtime",
    "crates/vaasut-scene",
    "crates/vaasut-ui",
]

[workspace.dependencies]
egui = "0.31"
eframe = { version = "0.31", default-features = false, features = ["wgpu", "default_fonts"] }
wgpu = "23.0"
glam = "0.30"
log = "0.4"
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
bytemuck = "1.21"
[target.'cfg(target_arch = "wasm32")'.dependencies]
web-sys = { version = "0.3", features = ["Window", "Document", "HtmlCanvasElement"] }

[dependencies]
vaasut-editor = { path = "crates/vaasut-editor" }
eframe = { workspace = true }

[lib]
crate-type = ["cdylib", "rlib"]

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = { workspace = true }
wasm-bindgen-futures = { workspace = true }
